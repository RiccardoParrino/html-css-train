<div class="track-card">
    <div class="album-img-container">
        <img class="album-img" src="{{track.imgUrl}}">
    </div>
    <div class="description-container">
        <div class="left-container">
            <p>{{track.name}}</p>
            <p>{{track.artistName}}</p>
        </div>
        <div class="right-container">
            <p>{{track.album}}</p>
            <p>{{track.date}}</p>
        </div>
    </div>
</div>
