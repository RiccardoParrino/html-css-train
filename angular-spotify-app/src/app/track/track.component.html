<div class="track-card">

    <img src="{{track.imgUrl}}">

    <div class="description-container">
        <div class="left-container">
            <p>{{track.name}}</p>
            <p>{{track.artistName}}</p>
        </div>
        <div class="right-container">
            <p>{{track.album}}</p>
            <p>{{track.date}}</p>
        </div>
    </div>
    
</div>
